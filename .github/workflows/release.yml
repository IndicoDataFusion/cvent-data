# On a version tag: test, build the cvent-sheets-export binaries (make dist)
# and attach them, with SHA256SUMS, to that tag's GitHub release (created
# if missing; existing notes are kept), so other repositories and CI jobs
# can download a pinned, checksum-verified exporter.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
