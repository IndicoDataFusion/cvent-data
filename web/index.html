<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Event Data</title>
<meta name="description" content="Event data: registrations, pricing, payments, attendees, check-in.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0d1512">
<!-- Pre-paint theme bootstrap. Loaded WITHOUT defer so it runs before the
     stylesheet link and before first paint. It is an external file because
     the server's CSP (default-src 'self') blocks inline <script> elements —
     only inline <style> is permitted (via style-src 'unsafe-inline'). -->
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></span>
      <h1 class="app-title">Event Data</h1>
    </div>
    <div class="topbar-actions">
      <label class="event-select-wrap" title="Event">
        <span class="event-select-label" aria-hidden="true">Event</span>
        <select id="event-select" class="event-select" hidden
                aria-label="Select event"></select>
      </label>
      <button id="theme-toggle" class="topbar-btn" type="button"
              aria-label="Change theme" title="Change theme">
        <span class="topbar-btn-icon" aria-hidden="true"></span>
      </button>
      <button id="refresh-btn" class="topbar-btn" type="button"
              aria-label="Refresh" title="Refresh">
        <span class="topbar-btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</header>

<div id="offline-banner" class="offline-banner" role="status" hidden>
  Offline. Showing last fetched data
</div>

<!-- View tab bar, populated by app.js from the active source's view keys
     (registry-driven, source-agnostic). Hidden on the events landing. -->
<nav id="view-tabs" class="view-tabs" role="tablist" aria-label="Event views" hidden></nav>

<main id="app-view" class="app-view"></main>

<footer class="footer">
  Event data · Cvent
  <span class="build-meta"><span class="build-sha" data-sha="__BUILD_SHA__">__BUILD_SHA__</span></span>
</footer>

<!-- Task 9 creates app.js (hash router + views). Referenced now as a deferred
     module; theme.js provides a graceful "loading…" fallback so the page is
     never blank if the module fails to load. -->
<script type="module" src="app.js" defer></script>
</body>
</html>
